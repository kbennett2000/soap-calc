<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soap Calculator</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #5c6470;
      --border: #d0d4d9;
      --row-bg: #ffffff;
      --row-alt: #f7f8fa;
      --accent: #1d4ed8;
      --accent-dark: #1742b8;
      --accent-soft: #dbe7ff;
      --toggle-bg: #eef0f3;
      --toggle-active-bg: #1a1a1a;
      --toggle-active-fg: #ffffff;
      --flash: #fff4c2;
      --error: #b91c1c;
      --error-soft: #fde2e2;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .view-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 16px;
    }
    .view-header h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 0;
      flex: 1;
    }

    .status {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 16px;
      min-height: 1.4em;
    }
    .status.error {
      color: var(--error);
      background: var(--error-soft);
      padding: 8px 12px;
      border-radius: 8px;
      min-height: auto;
    }

    /* --- Section blocks --- */
    .section {
      margin: 0 0 20px;
    }
    .section-label {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 8px;
    }

    /* --- Generic buttons --- */
    .btn {
      min-height: 48px;
      padding: 0 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      background: var(--toggle-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:hover { background: #e6e9ee; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled,
    .btn[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-danger {
      background: var(--bg);
      color: var(--error);
      border-color: var(--border);
    }
    .btn-danger:hover { background: var(--error-soft); }

    .btn-link {
      background: transparent;
      border: 1px solid transparent;
      color: var(--accent);
      font-weight: 600;
      font-size: 15px;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-link:hover { background: var(--accent-soft); }

    /* --- Preset buttons --- */
    .presets {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .preset-btn {
      min-height: 48px;
      padding: 0 4px;
      font: inherit;
      font-weight: 600;
      font-size: 16px;
      background: var(--toggle-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .preset-btn:hover { background: #e6e9ee; }
    .preset-btn:active { transform: translateY(1px); }

    /* --- Toggle groups (Heavy/Light, g/oz) --- */
    .toggles-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .toggle-group {
      display: flex;
      flex-direction: column;
      flex: 1 1 160px;
    }
    .toggle {
      display: inline-flex;
      background: var(--toggle-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      padding: 3px;
      gap: 3px;
    }
    .toggle button {
      flex: 1;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      background: transparent;
      color: var(--fg);
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .toggle button[aria-pressed="true"] {
      background: var(--toggle-active-bg);
      color: var(--toggle-active-fg);
    }

    /* --- Ingredients table --- */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    table.ingredients {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .ingredients th, .ingredients td {
      text-align: left;
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .ingredients thead th {
      background: #f1f3f5;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }
    .ingredients tbody tr:last-child td { border-bottom: 0; }
    .ingredients tbody tr.total-row td {
      background: #f7f8fa;
      font-weight: 600;
      border-top: 2px solid var(--border);
    }
    .ingredients td.name { font-weight: 600; }
    .ingredients td.factor {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 14px;
    }
    .ingredients td.input-cell {
      position: relative;
      padding: 6px 10px;
    }
    .ingredients td.unit {
      width: 36px;
      color: var(--muted);
      font-size: 15px;
      text-align: left;
      padding-left: 0;
    }

    .col-name   { width: 38%; }
    .col-factor { width: 22%; }
    .col-input  { width: auto; }
    .col-unit   { width: 44px; }

    input.weight {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      font: inherit;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      -moz-appearance: textfield;
    }
    input.weight::-webkit-outer-spin-button,
    input.weight::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input.weight:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* anchor row */
    tr.anchor td.input-cell input.weight {
      border-color: var(--accent);
      background: #f4f8ff;
    }
    tr.anchor td.name::before {
      content: "⚓ ";
      color: var(--accent);
      font-size: 0.9em;
    }

    @keyframes rowFlash {
      0%   { background-color: var(--flash); }
      100% { background-color: transparent; }
    }
    tr.flash td { animation: rowFlash 450ms ease-out; }
    tr.flash.total-row td {
      animation: rowFlash 450ms ease-out;
      background-color: var(--flash);
    }

    /* --- Measuring mode --- */
    .col-check { width: 48px; }
    th.col-check, td.check-cell { display: none; }
    body.measuring th.col-check,
    body.measuring td.check-cell { display: table-cell; }
    td.check-cell {
      padding: 0;
      text-align: center;
    }
    .check-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
      margin: 2px;
      border-radius: 8px;
    }
    .check-label:hover { background: var(--toggle-bg); }
    .check-label input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .measuring-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .measuring-controls .btn { min-width: 140px; }

    /* In measuring mode, hide the preset row, neutralize the anchor visuals,
       lock the inputs visually, and apply strikethrough to checked rows. */
    body.measuring .presets-section { display: none; }
    body.measuring tr.anchor td.name::before { content: none; }
    body.measuring tr.anchor td.input-cell input.weight {
      border-color: var(--border);
      background: #f7f8fa;
    }
    body.measuring input.weight {
      background: #f7f8fa;
      cursor: default;
      caret-color: transparent;
    }
    body.measuring tr.checked td.name,
    body.measuring tr.checked td.factor,
    body.measuring tr.checked td.unit {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      color: var(--muted);
    }
    body.measuring tr.checked input.weight {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      color: var(--muted);
    }

    /* --- Settings view --- */
    .settings-form {
      display: grid;
      gap: 16px;
    }
    .settings-field {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 12px;
      align-items: center;
    }
    .settings-label {
      font-weight: 600;
      font-size: 16px;
    }
    .settings-label small {
      display: block;
      font-weight: normal;
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    input.settings-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      font: inherit;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    input.settings-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    input.settings-input.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px var(--error-soft);
    }
    input.settings-input[readonly] {
      background: #f7f8fa;
      color: var(--muted);
      cursor: not-allowed;
    }
    .settings-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .settings-actions .spacer { flex: 1; }

    /* --- Recipe action bar (top of main view) --- */
    .recipe-action-bar {
      display: flex;
      gap: 10px;
    }
    .recipe-action-bar .btn {
      flex: 1;
      min-height: 48px;
      font-size: 16px;
    }

    /* --- Modals --- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 26, 0.42);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-backdrop[hidden] { display: none; }
    .modal-card {
      background: var(--bg);
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      flex: 1;
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-actions {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-actions .btn { min-height: 48px; }
    .modal-label {
      display: block;
      font-weight: 600;
      margin: 0 0 6px;
      font-size: 15px;
    }
    .modal-label + .modal-input { margin-bottom: 12px; }
    input.modal-input,
    textarea.modal-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      font: inherit;
      font-size: 17px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    textarea.modal-input {
      resize: vertical;
      min-height: 84px;
      line-height: 1.4;
    }
    .modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .modal-input.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px var(--error-soft);
    }
    .modal-error {
      color: var(--error);
      font-size: 14px;
      margin: -6px 0 12px;
      display: block;
    }

    /* --- Recipe list (inside Load modal) --- */
    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .recipe-row {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .recipe-row-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .recipe-name {
      font-weight: 600;
      font-size: 17px;
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .recipe-date {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    .recipe-notes {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
      word-break: break-word;
    }
    .recipe-row-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .recipe-row-actions .btn {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      font-size: 15px;
    }
    .recipe-empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 12px;
      font-size: 16px;
    }
    .recipe-rename-input {
      flex: 1;
      min-width: 0;
    }

    /* --- Toast --- */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      font-size: 14px;
      font-weight: 500;
      z-index: 100;
      opacity: 0;
      transition: opacity 220ms ease-out;
      pointer-events: none;
    }
    .toast[data-visible] { opacity: 1; }

    /* --- Responsive --- */
    @media (max-width: 520px) {
      .view-header h1 { font-size: 22px; }
      .presets { grid-template-columns: repeat(3, 1fr); }
      .col-name   { width: 36%; }
      .col-factor { width: 22%; }
      .col-unit   { width: 32px; }
      .ingredients td.factor { font-size: 12px; }
      .ingredients th, .ingredients td { padding: 8px 6px; }
      input.weight { font-size: 18px; }
      .toggle button { padding: 0 12px; font-size: 15px; }

      .settings-field {
        grid-template-columns: 1fr;
        gap: 4px;
      }
      .settings-actions .btn { flex: 1 1 auto; min-width: 0; }
      .settings-actions .spacer { display: none; }

      .modal-backdrop { padding: 0; }
      .modal-card {
        max-width: none;
        max-height: 100vh;
        height: 100vh;
        border-radius: 0;
      }
      .modal-actions .btn { flex: 1; min-width: 0; }
    }

    @media (max-width: 380px) {
      .ingredients td.factor { display: none; }
      .ingredients th.col-factor { display: none; }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="save-modal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="save-modal-title">
      <div class="modal-header">
        <h2 id="save-modal-title">Save recipe</h2>
      </div>
      <div class="modal-body">
        <label class="modal-label" for="save-recipe-name">Name</label>
        <input id="save-recipe-name" class="modal-input" type="text" autocomplete="off" maxlength="120">
        <span id="save-name-error" class="modal-error" hidden></span>
        <label class="modal-label" for="save-recipe-notes">Notes (optional)</label>
        <textarea id="save-recipe-notes" class="modal-input" rows="3" maxlength="2000"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-save-modal-cancel>Cancel</button>
        <button type="button" class="btn btn-primary" data-save-modal-confirm>Save</button>
      </div>
    </div>
  </div>

  <div id="load-modal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="load-modal-title">
      <div class="modal-header">
        <h2 id="load-modal-title">Load recipe</h2>
        <button type="button" class="btn-link" data-load-modal-close>Close</button>
      </div>
      <div class="modal-body">
        <div id="recipe-list" class="recipe-list" aria-live="polite"></div>
        <p id="recipe-empty-state" class="recipe-empty-state" hidden>No saved recipes yet.</p>
      </div>
    </div>
  </div>

  <main>
    <section id="main-view" class="view">
      <div class="view-header">
        <h1>Soap Calculator</h1>
        <button type="button" class="btn-link" data-show-settings>⚙ Settings</button>
      </div>
      <p id="status" class="status">Loading factors&hellip;</p>

      <section class="section presets-section" aria-labelledby="presets-label">
        <span id="presets-label" class="section-label">Lard presets</span>
        <div class="presets" role="group" aria-label="Lard presets">
          <button type="button" class="preset-btn" data-preset="205">205 g</button>
          <button type="button" class="preset-btn" data-preset="410">410 g</button>
          <button type="button" class="preset-btn" data-preset="615">615 g</button>
          <button type="button" class="preset-btn" data-preset="820">820 g</button>
          <button type="button" class="preset-btn" data-preset="1025">1025 g</button>
          <button type="button" class="preset-btn" data-preset="1230">1230 g</button>
        </div>
      </section>

      <section class="section">
        <div class="recipe-action-bar" role="group" aria-label="Recipe actions">
          <button type="button" class="btn" data-save-recipe disabled>Save Recipe</button>
          <button type="button" class="btn" data-load-recipe>Load Recipe</button>
        </div>
      </section>

      <section class="section">
        <div class="toggles-row">
          <div class="toggle-group">
            <span class="section-label">Essential oil</span>
            <div class="toggle" role="group" aria-label="Essential oil weight">
              <button type="button" data-eo-btn="heavy" aria-pressed="true">Heavy</button>
              <button type="button" data-eo-btn="light" aria-pressed="false">Light</button>
            </div>
          </div>

          <div class="toggle-group">
            <span class="section-label">Display unit</span>
            <div class="toggle" role="group" aria-label="Display unit">
              <button type="button" data-unit-btn="g" aria-pressed="true">g</button>
              <button type="button" data-unit-btn="oz" aria-pressed="false">oz</button>
            </div>
          </div>
        </div>
      </section>

      <section class="section measuring-controls">
        <button type="button" class="btn" data-start-measuring>Start measuring</button>
        <button type="button" class="btn" data-reset-checks hidden>Reset</button>
        <button type="button" class="btn btn-primary" data-done-measuring hidden>Done</button>
      </section>

      <section class="section" aria-label="Ingredients">
        <div class="table-wrap">
          <table class="ingredients">
            <thead>
              <tr>
                <th class="col-check" aria-label="Measured"></th>
                <th class="col-name">Ingredient</th>
                <th class="col-factor">Factor</th>
                <th class="col-input">Weight</th>
                <th class="col-unit" aria-label="Unit"></th>
              </tr>
            </thead>
            <tbody>
              <tr data-row="lard">
                <td class="check-cell"><label class="check-label"><input type="checkbox" data-check="lard" aria-label="Measured: Lard"></label></td>
                <td class="name">Lard</td>
                <td class="factor" data-factor="lard"></td>
                <td class="input-cell"><input class="weight" data-field="lard" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"></td>
                <td class="unit" data-unit-suffix>g</td>
              </tr>
              <tr data-row="coconut_oil">
                <td class="check-cell"><label class="check-label"><input type="checkbox" data-check="coconut_oil" aria-label="Measured: Coconut Oil"></label></td>
                <td class="name">Coconut Oil</td>
                <td class="factor" data-factor="coconut_oil"></td>
                <td class="input-cell"><input class="weight" data-field="coconut_oil" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"></td>
                <td class="unit" data-unit-suffix>g</td>
              </tr>
              <tr data-row="lye">
                <td class="check-cell"><label class="check-label"><input type="checkbox" data-check="lye" aria-label="Measured: Lye"></label></td>
                <td class="name">Lye</td>
                <td class="factor" data-factor="lye"></td>
                <td class="input-cell"><input class="weight" data-field="lye" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"></td>
                <td class="unit" data-unit-suffix>g</td>
              </tr>
              <tr data-row="water">
                <td class="check-cell"><label class="check-label"><input type="checkbox" data-check="water" aria-label="Measured: Water"></label></td>
                <td class="name">Water</td>
                <td class="factor" data-factor="water"></td>
                <td class="input-cell"><input class="weight" data-field="water" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"></td>
                <td class="unit" data-unit-suffix>g</td>
              </tr>
              <tr data-row="essential_oil">
                <td class="check-cell"><label class="check-label"><input type="checkbox" data-check="essential_oil" aria-label="Measured: Essential Oil"></label></td>
                <td class="name">Essential Oil</td>
                <td class="factor" data-factor="essential_oil"></td>
                <td class="input-cell"><input class="weight" data-field="essential_oil" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"></td>
                <td class="unit" data-unit-suffix>g</td>
              </tr>
              <tr data-row="total" class="total-row">
                <td class="check-cell"></td>
                <td class="name">Total</td>
                <td class="factor" data-factor="total"></td>
                <td class="input-cell"><input class="weight" data-field="total" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"></td>
                <td class="unit" data-unit-suffix>g</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>

    <section id="settings-view" class="view" hidden>
      <div class="view-header">
        <h1>Settings</h1>
      </div>
      <p id="settings-status" class="status"></p>

      <section class="section">
        <span class="section-label">Factors (weight per gram of lard)</span>
        <div class="settings-form">
          <label class="settings-field">
            <span class="settings-label">
              Lard
              <small>locked at 1.0</small>
            </span>
            <input class="settings-input" type="text" value="1" readonly aria-readonly="true">
          </label>
          <label class="settings-field">
            <span class="settings-label">Coconut Oil</span>
            <input class="settings-input" data-settings-factor="coconut_oil" type="text" inputmode="decimal" autocomplete="off">
          </label>
          <label class="settings-field">
            <span class="settings-label">Lye</span>
            <input class="settings-input" data-settings-factor="lye" type="text" inputmode="decimal" autocomplete="off">
          </label>
          <label class="settings-field">
            <span class="settings-label">Water</span>
            <input class="settings-input" data-settings-factor="water" type="text" inputmode="decimal" autocomplete="off">
          </label>
          <label class="settings-field">
            <span class="settings-label">Essential Oil (Heavy)</span>
            <input class="settings-input" data-settings-factor="essential_oil_heavy" type="text" inputmode="decimal" autocomplete="off">
          </label>
          <label class="settings-field">
            <span class="settings-label">Essential Oil (Light)</span>
            <input class="settings-input" data-settings-factor="essential_oil_light" type="text" inputmode="decimal" autocomplete="off">
          </label>
        </div>
      </section>

      <section class="section">
        <span class="section-label">Defaults</span>
        <div class="settings-form">
          <div class="settings-field">
            <span class="settings-label">Default unit</span>
            <div class="toggle" role="group" aria-label="Default unit">
              <button type="button" data-settings-unit="g" aria-pressed="true">g</button>
              <button type="button" data-settings-unit="oz" aria-pressed="false">oz</button>
            </div>
          </div>
          <div class="settings-field">
            <span class="settings-label">Default essential oil</span>
            <div class="toggle" role="group" aria-label="Default essential oil">
              <button type="button" data-settings-eo="heavy" aria-pressed="true">Heavy</button>
              <button type="button" data-settings-eo="light" aria-pressed="false">Light</button>
            </div>
          </div>
        </div>
      </section>

      <div class="settings-actions">
        <button type="button" class="btn" data-settings-reset>Reset to defaults</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-settings-cancel>Cancel</button>
        <button type="button" class="btn btn-primary" data-settings-save>Save</button>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    var G_PER_OZ = 28.3495231;
    var FIELDS = ['lard', 'coconut_oil', 'lye', 'water', 'essential_oil', 'total'];
    var FACTOR_KEYS = ['lard', 'coconut_oil', 'lye', 'water', 'essential_oil_heavy', 'essential_oil_light'];
    var EDITABLE_FACTOR_KEYS = ['coconut_oil', 'lye', 'water', 'essential_oil_heavy', 'essential_oil_light'];

    // SPEC §2.1 defaults — kept here so "Reset to defaults" doesn't depend on a fresh server fetch.
    var DEFAULT_FACTORS = {
      lard: 1.0,
      coconut_oil: 0.2512195122,
      lye: 0.1731707317,
      water: 0.4756097561,
      essential_oil_heavy: 0.06097560975609760,
      essential_oil_light: 0.03658536585
    };
    var DEFAULT_SETTINGS = { default_unit: 'g', default_eo_type: 'heavy' };

    var INGREDIENT_FIELDS = ['lard', 'coconut_oil', 'lye', 'water', 'essential_oil'];

    var state = {
      data: null,
      factors: null,
      eoType: 'heavy',
      unit: 'g',
      anchorField: 'lard',
      anchorWeightG: null,
      view: 'main',
      measuring: false
    };

    var statusEl = document.getElementById('status');
    var settingsStatusEl = document.getElementById('settings-status');
    var toastEl = document.getElementById('toast');
    var toastTimer = null;

    // ---- math + render ----

    function activeEoFactor() {
      return state.eoType === 'heavy'
        ? state.factors.essential_oil_heavy
        : state.factors.essential_oil_light;
    }

    function fieldFactor(field) {
      var f = state.factors;
      if (field === 'lard') return f.lard;
      if (field === 'coconut_oil') return f.coconut_oil;
      if (field === 'lye') return f.lye;
      if (field === 'water') return f.water;
      if (field === 'essential_oil') return activeEoFactor();
      if (field === 'total') {
        return f.lard + f.coconut_oil + f.lye + f.water + activeEoFactor();
      }
      throw new Error('unknown field: ' + field);
    }

    function weightForField(field) {
      if (state.anchorWeightG == null || state.anchorField == null) return null;
      var lardG = state.anchorWeightG / fieldFactor(state.anchorField);
      return lardG * fieldFactor(field);
    }

    function formatWeight(g) {
      if (g == null) return '';
      var v = state.unit === 'g' ? g : g / G_PER_OZ;
      return v.toFixed(2);
    }

    function formatFactor(n) {
      var s = n.toPrecision(8);
      if (s.indexOf('.') !== -1 && s.indexOf('e') === -1) {
        s = s.replace(/0+$/, '').replace(/\.$/, '');
      }
      return s;
    }

    function $field(field) {
      return document.querySelector('input[data-field="' + field + '"]');
    }
    function $row(field) {
      return document.querySelector('tr[data-row="' + field + '"]');
    }

    function renderFactorCells() {
      FIELDS.forEach(function (field) {
        var cell = document.querySelector('[data-factor="' + field + '"]');
        if (cell) cell.textContent = formatFactor(fieldFactor(field));
      });
    }

    function renderAnchorClass() {
      FIELDS.forEach(function (field) {
        var row = $row(field);
        if (state.anchorField === field && state.anchorWeightG != null) {
          row.classList.add('anchor');
        } else {
          row.classList.remove('anchor');
        }
      });
    }

    function renderAllInputs(skipField) {
      FIELDS.forEach(function (field) {
        if (field === skipField) return;
        var input = $field(field);
        var g = field === state.anchorField ? state.anchorWeightG : weightForField(field);
        input.value = formatWeight(g);
      });
    }

    function captureDisplay() {
      var snap = {};
      FIELDS.forEach(function (field) {
        var g = field === state.anchorField ? state.anchorWeightG : weightForField(field);
        snap[field] = formatWeight(g);
      });
      return snap;
    }

    function flashChangedRows(before) {
      FIELDS.forEach(function (field) {
        var after = formatWeight(field === state.anchorField ? state.anchorWeightG : weightForField(field));
        if (after !== before[field]) {
          var row = $row(field);
          row.classList.remove('flash');
          void row.offsetWidth;
          row.classList.add('flash');
        }
      });
    }

    function clearAll() {
      state.anchorField = 'lard';
      state.anchorWeightG = null;
      FIELDS.forEach(function (field) { $field(field).value = ''; });
      renderAnchorClass();
      updateSaveRecipeEnabled();
    }

    function onInput(e) {
      var field = e.target.dataset.field;
      var raw = e.target.value.trim();
      if (raw === '') {
        if (field === state.anchorField) clearAll();
        return;
      }
      var parsed = Number(raw);
      if (!isFinite(parsed) || parsed <= 0) return;
      var grams = state.unit === 'g' ? parsed : parsed * G_PER_OZ;
      state.anchorField = field;
      state.anchorWeightG = grams;
      renderAnchorClass();
      renderAllInputs(field);
      updateSaveRecipeEnabled();
    }

    function onBlur(e) {
      var field = e.target.dataset.field;
      if (state.anchorWeightG == null) return;
      var g = field === state.anchorField ? state.anchorWeightG : weightForField(field);
      e.target.value = formatWeight(g);
    }

    function applyPreset(grams) {
      state.anchorField = 'lard';
      state.anchorWeightG = grams;
      renderAnchorClass();
      FIELDS.forEach(function (field) {
        $field(field).value = formatWeight(field === 'lard' ? grams : weightForField(field));
      });
      updateSaveRecipeEnabled();
    }

    function setEoType(type) {
      if (state.eoType === type) return;
      var before = captureDisplay();
      state.eoType = type;
      document.querySelectorAll('[data-eo-btn]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.eoBtn === type ? 'true' : 'false');
      });
      renderFactorCells();
      if (state.anchorWeightG != null) {
        renderAllInputs(state.anchorField);
        flashChangedRows(before);
      }
      // §3.1.1: Heavy/Light change clears measuring checkboxes
      if (state.measuring) clearAllChecks();
    }

    function setUnit(unit) {
      if (state.unit === unit) return;
      state.unit = unit;
      document.querySelectorAll('[data-unit-btn]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.unitBtn === unit ? 'true' : 'false');
      });
      document.querySelectorAll('[data-unit-suffix]').forEach(function (s) {
        s.textContent = unit;
      });
      if (state.anchorWeightG != null) {
        FIELDS.forEach(function (field) {
          var g = field === state.anchorField ? state.anchorWeightG : weightForField(field);
          $field(field).value = formatWeight(g);
        });
      }
    }

    // ---- toast ----

    function showToast(message, durationMs) {
      toastEl.textContent = message;
      toastEl.hidden = false;
      // force reflow so the transition runs even if we re-show quickly
      void toastEl.offsetWidth;
      toastEl.setAttribute('data-visible', '');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.removeAttribute('data-visible');
        toastTimer = setTimeout(function () { toastEl.hidden = true; toastTimer = null; }, 260);
      }, durationMs || 2000);
    }

    // ---- views ----

    function showView(name) {
      state.view = name;
      document.getElementById('main-view').hidden = (name !== 'main');
      document.getElementById('settings-view').hidden = (name !== 'settings');
      if (name === 'settings') {
        populateSettingsForm(state.factors, state.data.settings);
        settingsStatusEl.className = 'status';
        settingsStatusEl.textContent = '';
      }
      if (name === 'main') {
        // Re-render in case factors changed while we were elsewhere
        renderFactorCells();
        if (state.anchorWeightG != null) renderAllInputs(state.anchorField);
        // Also catch up to the server in case a sibling tab pushed changes
        refreshFactorsIfChanged({ silent: true });
      }
    }

    // ---- settings ----

    function prettyName(key) {
      return {
        coconut_oil: 'Coconut Oil',
        lye: 'Lye',
        water: 'Water',
        essential_oil_heavy: 'Essential Oil (Heavy)',
        essential_oil_light: 'Essential Oil (Light)'
      }[key] || key;
    }

    function populateSettingsForm(factors, settings) {
      EDITABLE_FACTOR_KEYS.forEach(function (k) {
        var input = document.querySelector('[data-settings-factor="' + k + '"]');
        input.value = String(factors[k]);
        input.classList.remove('invalid');
      });
      var unit = (settings && settings.default_unit) || 'g';
      var eo = (settings && settings.default_eo_type) || 'heavy';
      document.querySelectorAll('[data-settings-unit]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.settingsUnit === unit ? 'true' : 'false');
      });
      document.querySelectorAll('[data-settings-eo]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.settingsEo === eo ? 'true' : 'false');
      });
    }

    function settingsReset() {
      populateSettingsForm(DEFAULT_FACTORS, DEFAULT_SETTINGS);
      settingsStatusEl.className = 'status';
      settingsStatusEl.textContent = 'Form reset to defaults. Click Save to apply.';
    }

    function settingsCancel() {
      showView('main');
    }

    function settingsSave() {
      settingsStatusEl.className = 'status';
      settingsStatusEl.textContent = '';

      var newFactors = { lard: 1.0 };
      var badNames = [];
      EDITABLE_FACTOR_KEYS.forEach(function (k) {
        var input = document.querySelector('[data-settings-factor="' + k + '"]');
        var raw = input.value.trim();
        var n = Number(raw);
        input.classList.remove('invalid');
        if (raw === '' || !isFinite(n) || n <= 0) {
          input.classList.add('invalid');
          badNames.push(prettyName(k));
        } else {
          newFactors[k] = n;
        }
      });

      if (badNames.length) {
        settingsStatusEl.className = 'status error';
        settingsStatusEl.textContent = 'Each factor must be a positive number. Fix: ' + badNames.join(', ') + '.';
        return;
      }

      var newUnit = document.querySelector('[data-settings-unit][aria-pressed="true"]').dataset.settingsUnit;
      var newEo = document.querySelector('[data-settings-eo][aria-pressed="true"]').dataset.settingsEo;

      var newData = JSON.parse(JSON.stringify(state.data));
      newData.factor_sets.default = newFactors;
      newData.settings.default_unit = newUnit;
      newData.settings.default_eo_type = newEo;

      settingsStatusEl.className = 'status';
      settingsStatusEl.textContent = 'Saving…';

      fetch('/api/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newData)
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function () {
        state.data = newData;
        state.factors = newData.factor_sets.default;
        renderFactorCells();
        if (state.anchorWeightG != null) renderAllInputs(state.anchorField);
        showView('main');
        showToast('Settings saved');
      }).catch(function (err) {
        settingsStatusEl.className = 'status error';
        settingsStatusEl.textContent = 'Save failed: ' + err.message + '. Your edits are still here.';
      });
    }

    // ---- visibility / cross-tab refresh ----

    function factorsEqual(a, b) {
      for (var i = 0; i < FACTOR_KEYS.length; i++) {
        var k = FACTOR_KEYS[i];
        if (a[k] !== b[k]) return false;
      }
      return true;
    }

    function refreshFactorsIfChanged(opts) {
      opts = opts || {};
      if (!state.data) return; // initial load hasn't finished yet
      fetch('/api/data', { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (fresh) {
          if (!fresh) return;
          var freshSet = fresh.factor_sets && fresh.factor_sets.default;
          if (!freshSet) return;
          var factorsDiffer = !factorsEqual(state.factors, freshSet);
          // Always absorb the fresh blob — recipes/settings may have changed
          // even when factors haven't, and we don't want a subsequent local
          // PUT to clobber another tab's writes.
          var beforeDisplay = factorsDiffer ? captureDisplay() : null;
          state.data = fresh;
          state.factors = freshSet;
          if (!factorsDiffer) return;
          renderFactorCells();
          if (state.anchorWeightG != null) {
            renderAllInputs(state.anchorField);
            flashChangedRows(beforeDisplay);
          }
          // §3.1.1: factor change clears measuring checkboxes
          if (state.measuring) clearAllChecks();
          if (!opts.silent) showToast('Factors updated');
        })
        .catch(function () { /* silent — try again on next visibility change */ });
    }

    function onVisibilityChange() {
      if (document.visibilityState === 'visible' && state.view === 'main') {
        refreshFactorsIfChanged();
      }
    }

    // ---- measuring mode (SPEC §3.1.1) ----

    function setCheckboxState(field, checked) {
      var cb = document.querySelector('input[data-check="' + field + '"]');
      if (cb) cb.checked = checked;
      var row = $row(field);
      if (!row) return;
      if (checked) row.classList.add('checked');
      else row.classList.remove('checked');
    }

    function clearAllChecks() {
      INGREDIENT_FIELDS.forEach(function (field) {
        setCheckboxState(field, false);
      });
    }

    function onCheckboxToggle(e) {
      var field = e.target.dataset.check;
      setCheckboxState(field, e.target.checked);
    }

    function enterMeasuring() {
      state.measuring = true;
      document.body.classList.add('measuring');
      FIELDS.forEach(function (field) {
        $field(field).setAttribute('readonly', '');
      });
      clearAllChecks();
      document.querySelector('[data-start-measuring]').hidden = true;
      document.querySelector('[data-reset-checks]').hidden = false;
      document.querySelector('[data-done-measuring]').hidden = false;
    }

    function exitMeasuring() {
      state.measuring = false;
      document.body.classList.remove('measuring');
      FIELDS.forEach(function (field) {
        $field(field).removeAttribute('readonly');
      });
      clearAllChecks();
      document.querySelector('[data-start-measuring]').hidden = false;
      document.querySelector('[data-reset-checks]').hidden = true;
      document.querySelector('[data-done-measuring]').hidden = true;
    }

    // ---- recipes (SPEC §3.3) ----

    function updateSaveRecipeEnabled() {
      var btn = document.querySelector('[data-save-recipe]');
      if (btn) btn.disabled = (state.anchorWeightG == null);
    }

    function genRecipeId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function formatRecipeDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      try {
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) {
        return iso;
      }
    }

    function bodyScrollLock(locked) {
      document.body.style.overflow = locked ? 'hidden' : '';
    }

    function openSaveModal() {
      if (state.anchorWeightG == null) return;
      var nameEl = document.getElementById('save-recipe-name');
      var notesEl = document.getElementById('save-recipe-notes');
      var errorEl = document.getElementById('save-name-error');
      nameEl.value = '';
      nameEl.classList.remove('invalid');
      notesEl.value = '';
      errorEl.hidden = true;
      errorEl.textContent = '';
      document.getElementById('save-modal').hidden = false;
      bodyScrollLock(true);
      setTimeout(function () { nameEl.focus(); }, 30);
    }

    function closeSaveModal() {
      document.getElementById('save-modal').hidden = true;
      bodyScrollLock(false);
    }

    function saveRecipeFromModal() {
      var nameEl = document.getElementById('save-recipe-name');
      var notesEl = document.getElementById('save-recipe-notes');
      var errorEl = document.getElementById('save-name-error');
      nameEl.classList.remove('invalid');
      errorEl.hidden = true;
      errorEl.textContent = '';

      var name = nameEl.value.trim();
      if (name === '') {
        nameEl.classList.add('invalid');
        errorEl.textContent = 'Please enter a name.';
        errorEl.hidden = false;
        nameEl.focus();
        return;
      }
      if (state.anchorWeightG == null) {
        errorEl.textContent = 'No recipe to save. Enter a weight first.';
        errorEl.hidden = false;
        return;
      }

      var recipe = {
        id: genRecipeId(),
        name: name,
        factor_set_id: 'default',
        anchor_field: state.anchorField,
        anchor_value_g: state.anchorWeightG,
        eo_type: state.eoType,
        notes: notesEl.value || '',
        created_at: new Date().toISOString()
      };

      var newData = JSON.parse(JSON.stringify(state.data));
      newData.recipes = (newData.recipes || []).slice();
      newData.recipes.push(recipe);

      var confirmBtn = document.querySelector('[data-save-modal-confirm]');
      confirmBtn.disabled = true;

      fetch('/api/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newData)
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function () {
        state.data = newData;
        confirmBtn.disabled = false;
        closeSaveModal();
        showToast('Recipe saved');
      }).catch(function (err) {
        confirmBtn.disabled = false;
        errorEl.textContent = 'Save failed: ' + err.message;
        errorEl.hidden = false;
      });
    }

    function openLoadModal() {
      // Re-fetch so cross-tab additions are visible
      fetch('/api/data', { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (fresh) {
          if (fresh) state.data = fresh;
          renderRecipeList();
          document.getElementById('load-modal').hidden = false;
          bodyScrollLock(true);
        })
        .catch(function () {
          renderRecipeList();
          document.getElementById('load-modal').hidden = false;
          bodyScrollLock(true);
        });
    }

    function closeLoadModal() {
      document.getElementById('load-modal').hidden = true;
      bodyScrollLock(false);
    }

    function renderRecipeList() {
      var listEl = document.getElementById('recipe-list');
      var emptyEl = document.getElementById('recipe-empty-state');
      listEl.innerHTML = '';
      var recipes = ((state.data && state.data.recipes) || []).slice();
      recipes.sort(function (a, b) {
        return String(b.created_at || '').localeCompare(String(a.created_at || ''));
      });
      if (recipes.length === 0) {
        listEl.hidden = true;
        emptyEl.hidden = false;
        return;
      }
      listEl.hidden = false;
      emptyEl.hidden = true;
      recipes.forEach(function (r) { listEl.appendChild(buildRecipeRow(r)); });
    }

    function buildRecipeRow(recipe) {
      var row = document.createElement('div');
      row.className = 'recipe-row';
      row.dataset.recipeId = recipe.id;

      var head = document.createElement('div');
      head.className = 'recipe-row-head';
      var nameEl = document.createElement('div');
      nameEl.className = 'recipe-name';
      nameEl.textContent = recipe.name;
      var dateEl = document.createElement('div');
      dateEl.className = 'recipe-date';
      dateEl.textContent = formatRecipeDate(recipe.created_at);
      head.appendChild(nameEl);
      head.appendChild(dateEl);
      row.appendChild(head);

      var notesText = (recipe.notes || '').trim();
      if (notesText) {
        var notesEl = document.createElement('div');
        notesEl.className = 'recipe-notes';
        var preview = notesText.length > 40 ? notesText.slice(0, 40) + '…' : notesText;
        notesEl.textContent = preview;
        row.appendChild(notesEl);
      }

      var actions = document.createElement('div');
      actions.className = 'recipe-row-actions';
      var loadBtn = document.createElement('button');
      loadBtn.type = 'button';
      loadBtn.className = 'btn btn-primary';
      loadBtn.textContent = 'Load';
      loadBtn.addEventListener('click', function () { loadRecipe(recipe.id); });
      var renameBtn = document.createElement('button');
      renameBtn.type = 'button';
      renameBtn.className = 'btn';
      renameBtn.textContent = 'Rename';
      renameBtn.addEventListener('click', function () { startRenameRecipe(row, recipe); });
      var deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'btn btn-danger';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', function () { deleteRecipe(recipe); });
      actions.appendChild(loadBtn);
      actions.appendChild(renameBtn);
      actions.appendChild(deleteBtn);
      row.appendChild(actions);
      return row;
    }

    function startRenameRecipe(row, recipe) {
      var nameEl = row.querySelector('.recipe-name');
      var actions = row.querySelector('.recipe-row-actions');

      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'modal-input recipe-rename-input';
      input.value = recipe.name;
      input.maxLength = 120;
      nameEl.replaceWith(input);

      actions.innerHTML = '';
      var saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'btn btn-primary';
      saveBtn.textContent = 'Save';
      var cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'btn';
      cancelBtn.textContent = 'Cancel';
      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);

      function commit() {
        var newName = input.value.trim();
        if (newName === '') {
          input.classList.add('invalid');
          input.focus();
          return;
        }
        if (newName === recipe.name) {
          renderRecipeList();
          return;
        }
        renameRecipe(recipe.id, newName);
      }
      cancelBtn.addEventListener('click', function () { renderRecipeList(); });
      saveBtn.addEventListener('click', commit);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') commit();
        else if (e.key === 'Escape') renderRecipeList();
      });
      input.focus();
      input.select();
    }

    function renameRecipe(id, newName) {
      var newData = JSON.parse(JSON.stringify(state.data));
      var recipes = newData.recipes || [];
      var idx = -1;
      for (var i = 0; i < recipes.length; i++) {
        if (recipes[i].id === id) { idx = i; break; }
      }
      if (idx < 0) return;
      recipes[idx].name = newName;
      fetch('/api/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newData)
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        state.data = newData;
        renderRecipeList();
        showToast('Recipe renamed');
      }).catch(function () {
        showToast('Rename failed');
        renderRecipeList();
      });
    }

    function deleteRecipe(recipe) {
      if (!confirm("Delete '" + recipe.name + "'?")) return;
      var newData = JSON.parse(JSON.stringify(state.data));
      newData.recipes = (newData.recipes || []).filter(function (r) { return r.id !== recipe.id; });
      fetch('/api/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newData)
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        state.data = newData;
        renderRecipeList();
        showToast('Recipe deleted');
      }).catch(function () {
        showToast('Delete failed');
      });
    }

    function loadRecipe(id) {
      var recipe = ((state.data && state.data.recipes) || []).find(function (r) { return r.id === id; });
      if (!recipe) return;

      if (state.measuring) exitMeasuring();

      state.anchorField = recipe.anchor_field;
      state.anchorWeightG = recipe.anchor_value_g;
      if (recipe.eo_type && recipe.eo_type !== state.eoType) {
        state.eoType = recipe.eo_type;
        document.querySelectorAll('[data-eo-btn]').forEach(function (b) {
          b.setAttribute('aria-pressed', b.dataset.eoBtn === state.eoType ? 'true' : 'false');
        });
        renderFactorCells();
      }

      renderAnchorClass();
      FIELDS.forEach(function (field) {
        var g = field === state.anchorField ? state.anchorWeightG : weightForField(field);
        $field(field).value = formatWeight(g);
      });
      updateSaveRecipeEnabled();
      closeLoadModal();
      showToast('Loaded: ' + recipe.name);
    }

    // ---- wiring ----

    function wireEvents() {
      document.querySelectorAll('input[data-field]').forEach(function (i) {
        i.addEventListener('input', onInput);
        i.addEventListener('blur', onBlur);
      });
      document.querySelectorAll('[data-preset]').forEach(function (b) {
        b.addEventListener('click', function () { applyPreset(Number(b.dataset.preset)); });
      });
      document.querySelectorAll('[data-eo-btn]').forEach(function (b) {
        b.addEventListener('click', function () { setEoType(b.dataset.eoBtn); });
      });
      document.querySelectorAll('[data-unit-btn]').forEach(function (b) {
        b.addEventListener('click', function () { setUnit(b.dataset.unitBtn); });
      });
      document.querySelector('[data-show-settings]').addEventListener('click', function () {
        showView('settings');
      });
      document.querySelectorAll('[data-settings-unit]').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('[data-settings-unit]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
        });
      });
      document.querySelectorAll('[data-settings-eo]').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('[data-settings-eo]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
        });
      });
      document.querySelector('[data-settings-reset]').addEventListener('click', settingsReset);
      document.querySelector('[data-settings-cancel]').addEventListener('click', settingsCancel);
      document.querySelector('[data-settings-save]').addEventListener('click', settingsSave);
      document.querySelector('[data-start-measuring]').addEventListener('click', enterMeasuring);
      document.querySelector('[data-done-measuring]').addEventListener('click', exitMeasuring);
      document.querySelector('[data-reset-checks]').addEventListener('click', clearAllChecks);
      document.querySelectorAll('input[data-check]').forEach(function (cb) {
        cb.addEventListener('change', onCheckboxToggle);
      });
      document.querySelector('[data-save-recipe]').addEventListener('click', openSaveModal);
      document.querySelector('[data-load-recipe]').addEventListener('click', openLoadModal);
      document.querySelector('[data-save-modal-cancel]').addEventListener('click', closeSaveModal);
      document.querySelector('[data-save-modal-confirm]').addEventListener('click', saveRecipeFromModal);
      document.querySelector('[data-load-modal-close]').addEventListener('click', closeLoadModal);
      document.addEventListener('visibilitychange', onVisibilityChange);
    }

    function applyDataFromServer(data) {
      var set = data && data.factor_sets && data.factor_sets.default;
      if (!set) throw new Error('no default factor set in data');
      state.data = data;
      state.factors = set;
      if (data.settings && data.settings.default_eo_type) {
        state.eoType = data.settings.default_eo_type;
      }
      if (data.settings && data.settings.default_unit) {
        state.unit = data.settings.default_unit;
      }
      document.querySelectorAll('[data-eo-btn]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.eoBtn === state.eoType ? 'true' : 'false');
      });
      document.querySelectorAll('[data-unit-btn]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.unitBtn === state.unit ? 'true' : 'false');
      });
      document.querySelectorAll('[data-unit-suffix]').forEach(function (s) {
        s.textContent = state.unit;
      });
      renderFactorCells();
      renderAnchorClass();
      updateSaveRecipeEnabled();
    }

    function init() {
      fetch('/api/data', { headers: { 'Accept': 'application/json' } })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          applyDataFromServer(data);
          wireEvents();
          statusEl.textContent = '';
        })
        .catch(function (err) {
          statusEl.className = 'status error';
          statusEl.textContent = 'Failed to load /api/data: ' + err.message;
        });
    }

    init();
  </script>
</body>
</html>
