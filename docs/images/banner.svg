<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Soap Calculator — offline-first soap recipe scaler for home cold-process soapmaking">
  <title>Soap Calculator</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f7ff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd3ff"/>
      <stop offset="1" stop-color="#7ea8f7"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#cfe0ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7ea8f7" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <style>
    .wm  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; }
  </style>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="#ffffff"/>
  <rect x="40" y="40" width="1200" height="560" rx="36" fill="url(#panel)" stroke="#d0d4d9" stroke-width="2"/>

  <!-- ===== illustration: soap bar + bubbles ===== -->
  <g>
    <!-- ground shadow -->
    <ellipse cx="300" cy="452" rx="190" ry="30" fill="#1d4ed8" opacity="0.12"/>

    <!-- soap bar: front face + beveled top -->
    <rect x="150" y="298" width="300" height="132" rx="34" fill="url(#bar)"/>
    <rect x="150" y="276" width="300" height="86" rx="34" fill="url(#barTop)"/>
    <!-- seam between top bevel and body -->
    <path d="M168 338 q132 26 264 0" fill="none" stroke="#1742b8" stroke-width="3" opacity="0.25"/>
    <!-- top sheen -->
    <rect x="172" y="290" width="256" height="44" rx="22" fill="#ffffff" opacity="0.30"/>
    <!-- embossed drop stamp on the bar -->
    <path d="M300 356 c20 22 30 36 30 52 a30 30 0 0 1 -60 0 c0 -16 10 -30 30 -52 z" fill="#1742b8" opacity="0.28"/>
    <path d="M300 356 c20 22 30 36 30 52 a30 30 0 0 1 -60 0 c0 -16 10 -30 30 -52 z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.45"/>

    <!-- bubbles -->
    <circle cx="196" cy="216" r="34" fill="url(#bubble)"/>
    <circle cx="186" cy="206" r="9" fill="#ffffff" opacity="0.9"/>
    <circle cx="276" cy="172" r="22" fill="url(#bubble)"/>
    <circle cx="270" cy="166" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="372" cy="214" r="44" fill="url(#bubble)"/>
    <circle cx="356" cy="200" r="12" fill="#ffffff" opacity="0.9"/>
    <circle cx="436" cy="262" r="16" fill="url(#bubble)"/>
  </g>

  <!-- ===== wordmark + tagline ===== -->
  <g class="wm">
    <text x="548" y="286" font-size="74" font-weight="700" fill="#1a1a1a" letter-spacing="-1.5">Soap Calculator</text>
    <text x="551" y="338" font-size="29" font-weight="400" fill="#5c6470">Offline-first soap recipe scaler</text>
    <text x="551" y="378" font-size="29" font-weight="400" fill="#5c6470">for home cold-process soapmaking</text>

    <!-- chips -->
    <g font-size="24" font-weight="600">
      <rect x="550" y="430" width="226" height="52" rx="26" fill="#ffffff" stroke="#d0d4d9" stroke-width="2"/>
      <circle cx="582" cy="456" r="7" fill="#15803d"/>
      <text x="600" y="464" fill="#1a1a1a">0 dependencies</text>

      <rect x="792" y="430" width="186" height="52" rx="26" fill="#ffffff" stroke="#d0d4d9" stroke-width="2"/>
      <circle cx="824" cy="456" r="7" fill="#1d4ed8"/>
      <text x="842" y="464" fill="#1a1a1a">100% offline</text>

      <rect x="994" y="430" width="196" height="52" rx="26" fill="#ffffff" stroke="#d0d4d9" stroke-width="2"/>
      <circle cx="1026" cy="456" r="7" fill="#6b8a76"/>
      <text x="1044" y="464" fill="#1a1a1a">no build step</text>
    </g>
  </g>
</svg>
